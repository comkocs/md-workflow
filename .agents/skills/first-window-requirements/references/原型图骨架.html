<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>【产品名】原型图</title>
  <style>
    body { margin: 0; color: #222; background: #f4f4f4; font-family: sans-serif; }
    main { max-width: 960px; margin: auto; padding: 24px; }
    section { margin: 24px 0; padding: 20px; border: 2px solid #777; background: white; }
    .wireframe { padding: 32px 16px; border: 1px dashed #777; }
    .basis { color: #555; }
  </style>
</head>
<body>
  <main>
    <h1>【产品名】静态线框</h1>
    <p class="basis">依据:需求原话件第 N 行</p>
    <p>仅填已确认需求,将 N 换成真实行号;每页复制一节,标题与功能清单对应,不接后端。</p>
    <section aria-labelledby="page-title">
      <h2 id="page-title">【与功能清单一致的页面标题】</h2>
      <p class="basis">依据:需求原话件第 N 行</p>
      <div class="wireframe">【本页已确认的内容与操作区域】</div>
    </section>
  </main>
</body>
</html>
